<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>404 Not Found - dmaorg archive</title>
    <style>
        :root {
            --bg: #0e1116;
            --surface: #161b22;
            --surface-hover: #1c232d;
            --border: #262e3a;
            --border-hover: #3b4658;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #79c0ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .error-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .error-code {
            display: inline-block;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            background-color: rgba(121, 192, 255, 0.1);
            border: 1px solid rgba(121, 192, 255, 0.25);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .error-details {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 1.75rem;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 1.15rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .btn-primary {
            background-color: #238636;
            border: 1px solid rgba(240, 246, 252, 0.1);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-hover);
            color: var(--accent);
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p class="error-details">The requested page does not exist.</p>
        <div class="error-actions">
            <a href="https://www.dmaorg.site" class="btn btn-primary">Take Me Home</a>
        </div>
    </main>
</body>

</html>
